@font-face{font-family:Fraunces;src:url(/fonts/fraunces.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-sans.woff2) format('woff2');font-weight:400 700;font-display:swap}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0e0b09;color:#efe6d4;font-family:'Instrument Sans',system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:2rem;overflow:hidden}

@keyframes sway{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-2vh)}}

</style>
</head>
